bio: I’m a computer science undergraduate at West Virginia University, with a minor in Applied Mathematics. I conduct research in the Machine Intelligence Lab with Dr. Gyawali and through Algoverse. My medical vision-language model research is supported by the UR2PhD program.
interests: I’m broadly interested in **multimodal learning, interpretability, and intelligent agents**—how models represent information, reason across modalities, and act. I’m also interested in reinforcement learning, robotics, world models, and the systems used to train and evaluate AI.
current: Currently, I study sycophancy in language and medical vision-language models, privacy leakage in multi-turn conversations, and methods for evaluating AI systems.
